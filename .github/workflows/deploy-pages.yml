name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # A repo-admin API call is required to CREATE a Pages site, and the
      # Actions GITHUB_TOKEN cannot do that ("Resource not accessible by
      # integration"). So we only deploy when Pages has already been enabled
      # once (Settings -> Pages -> Source: GitHub Actions); otherwise we emit
      # a notice and skip, keeping the run green instead of red.
      - name: Check if GitHub Pages is enabled
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled yet. Enable it once: Settings -> Pages -> Source: 'GitHub Actions'. This workflow will deploy automatically on the next push."
          fi

      - name: Stage dashboard site
        if: steps.check.outputs.enabled == 'true'
        run: |
          mkdir -p _site
          cp index.html _site/
          touch _site/.nojekyll

      - name: Setup Pages
        if: steps.check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
