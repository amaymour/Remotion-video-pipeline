name: Generate Video

on:
  repository_dispatch:
    types: [trigger-video-generation]
  workflow_dispatch:
    inputs:
      niche:
        description: "Niche keyword (e.g. Tech Tools)"
        required: false
        default: "Tech Tools"

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.11"
  # OmniRoute gateway base context. Default is the user's LOCAL stack
  # (http://localhost:20128/v1) which github-hosted runners cannot reach.
  # Set OMNIROUTE_BASE_URL as a repository variable to point at a reachable
  # endpoint; otherwise the pipeline falls back to a zero-cost template script.
  OMNIROUTE_BASE_URL: ${{ vars.OMNIROUTE_BASE_URL || 'http://localhost:20128/v1' }}
  OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY || 'sk_omniroute' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch live trends (free, Google News RSS)
        run: |
          python fetch_trends.py "${{ github.event.client_payload.niche || inputs.niche || 'Tech Tools' }}"

      - name: Generate script + voiceover (OmniRoute + edge-tts)
        env:
          NICHE: ${{ github.event.client_payload.niche || inputs.niche || 'Tech Tools' }}
        run: |
          python scripts/generate_script.py

      - name: Typecheck Remotion sources
        run: npm run typecheck

      - name: Ensure Remotion browser (bundled Chrome Headless Shell)
        # Remotion 4.0.535 downloads and uses its own pinned Chrome Headless
        # Shell instead of the runner's system Chrome (which is too new and
        # crashed the 4.0.0 launcher with --single-process). Pre-fetch it here so
        # download problems surface as their own step.
        run: npx remotion browser ensure

      - name: Render video with Remotion
        run: |
          npx remotion render src/index.ts Demo out/video.mp4 \
            --props-file data/script.json

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
          retention-days: 5

      - name: Report output video (Remotion's bundled ffprobe)
        if: always()
        run: |
          if [ -f out/video.mp4 ]; then
            ls -lh out/video.mp4
            npx remotion ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_type,codec_name,width,height,channels -of default=noprint_wrappers=1 out/video.mp4
          else
            echo "::warning::out/video.mp4 was not produced"
          fi
